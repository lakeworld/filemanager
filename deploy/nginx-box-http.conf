# Temporary HTTP-only Nginx config for testing box / license subdomains.
# Replace with deploy/nginx-box.conf after DNS and SSL certificates are ready.

upstream qihe_license_backend {
    server 127.0.0.1:8090;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=box_global:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=box_download:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=box_conn:10m;

server {
    listen 80;
    server_name box.qihebook.cloud;

    root /opt/qihe-erp/qihefilemanager/web-tools/dist;
    index index.html;

    limit_req zone=box_global burst=30 nodelay;
    limit_conn box_conn 10;

    location /downloads/ {
        limit_req zone=box_download burst=3 nodelay;
        limit_conn box_conn 2;
        alias /opt/qihe-erp/qihefilemanager/downloads/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name license.qihebook.cloud;

    limit_req zone=box_global burst=30 nodelay;
    limit_conn box_conn 10;

    location / {
        proxy_pass http://qihe_license_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
    }
}
