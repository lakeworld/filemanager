# Nginx configuration for Qihe File Manager (box.qihebook.cloud)
#
# Place this file at /etc/nginx/sites-available/qihe-box.conf
# then enable with:
#   sudo ln -s /etc/nginx/sites-available/qihe-box.conf /etc/nginx/sites-enabled/qihe-box.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Assumes a Let's Encrypt certificate exists for the domain.

# Global rate limits
limit_req_zone $binary_remote_addr zone=box_global:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=box_download:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=box_conn:10m;

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name box.qihebook.cloud;
    return 301 https://$host$request_uri;
}

# box.qihebook.cloud - static marketing / download site
server {
    listen 443 ssl http2;
    server_name box.qihebook.cloud;

    ssl_certificate /etc/letsencrypt/live/box.qihebook.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/box.qihebook.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    server_tokens off;

    root /opt/qihe-erp/qihefilemanager/web-tools/dist;
    index index.html;

    limit_req zone=box_global burst=30 nodelay;
    limit_conn box_conn 10;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Download protection: one request per second per IP, burst of 3.
    location /downloads/ {
        limit_req zone=box_download burst=3 nodelay;
        limit_conn box_conn 2;
        alias /opt/qihe-erp/qihefilemanager/downloads/;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
