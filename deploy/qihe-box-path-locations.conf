# Qihe File Manager (box) downloads location
# Included from qihe-erp.conf server block for www.qihebook.cloud
#
# NOTE: The marketing site (web-tools) has been merged into the main ERP SPA.
# The official site is now served at "/" by the Go backend. Only the installer
# download remains under /box/.

# Protected installer downloads
location /box/downloads/ {
    alias /opt/qihe-erp/qihefilemanager/downloads/;
    limit_req zone=box_download burst=3 nodelay;
    limit_conn box_conn 2;
    add_header Cache-Control "public, max-age=3600" always;
}
