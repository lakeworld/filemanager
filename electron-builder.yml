# 打包配置（electron-builder）
# Linux: AppImage + deb（本机 Deepin 构建验证）
# Windows: NSIS 安装包 + 便携 exe（配置就绪，Windows/CI 构建）
appId: com.qihe.filemanager
productName: 启禾文件管理
copyright: Copyright © 2026 启禾软件

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - build/trayicon.png
  - build/appicon.png
  - build/logo.png
  # v2.2.1：logo.png 用于 startDrag 拖拽图标，缺失则安装版拖拽失败（打包回归）
  # v2.1.2 包瘦身：渲染层已把 pdfjs / @tanstack/solid-virtual 打进 bundle
  # （pdf.worker 也已复制到 renderer assets），node_modules 里的 101MB pdfjs-dist 是死重，排除
  - '!node_modules/pdfjs-dist/**'
  - '!node_modules/@tanstack/**'

# asar + maximum 压缩：体积优化
asar: true
compression: maximum

# sharp 原生 .so 库必须从 asar 解包（否则 dlopen 失败，缩略图功能全废）
asarUnpack:
  - node_modules/@img/**
  - node_modules/sharp/**

# 精简 Chromium 语言包（只留中文+英文，省 ~20MB）
electronLanguages:
  - zh-CN
  - en-US

# sharp 为 N-API 模块，无需 rebuild；跳过以加速构建
npmRebuild: false

linux:
  target:
    - AppImage
    - deb
  icon: build/appicon.png
  category: Office
  maintainer: 启禾软件 <dev@qihe.local>
  synopsis: 电商产品图包与证书管理工具
  # v2.1.1 进程瘦身：去 zygote（-3 进程 -118MB）+ 禁用 GPU（Deepin 软件渲染纯开销，-117MB）。
  # 参数必须为启动参数（appendSwitch 运行时设置不生效）；仅 Linux 生效（Windows 无 zygote 且保留 GPU 加速）。
  # v2.3.0：V8 堆上限 2048 → 1024、半空间 32 → 16（GC 更积极、常驻内存下降；PDF 预览仍有余量）
  # v2.4.5（T2 实测回退）：--enable-features=NetworkServiceInProcess 在 Electron 31 实测不生效
  # （network.mojom.NetworkService 仍独立成 utility 进程，RSS ~70MB），按 PLAN-v2.4.5 §三预案撤回，不固化。
  # v2.4.6：删 --max-semi-space-size=16（Node 20 / V8 11.3 起 semi-space 随堆上限自适应缩小，
  # 显式 16MB 反把每个 isolate 年轻代抬到 ~48MB，见 nodejs/node#55487）；
  # 堆上限 1024 → 768（GC 更积极，PDF 内嵌预览有 100MB 文件上限兜底，余量充足）。
  # --in-process-gpu 保留：实测（Deepin）--disable-gpu 下 GPU 进程仍创建（软件渲染，~149MB RSS），
  # 删掉该参数后 gpu 进程独立常驻、托盘 RSS 合计 +50MB——调研结论“冗余”与实测不符，以实测为准。
  executableArgs:
    - --no-zygote
    - --no-sandbox
    - --disable-gpu
    - --in-process-gpu
    - --js-flags=--max-old-space-size=768

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/windows/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 启禾文件管理
  # v2.4.2（批次二）卸载策略决策：保留 %APPDATA% 用户数据（缩略图缓存/索引/日志/账号 token）。
  # 理由：卸载后重装/降级不丢体验与登录态，且工作区数据本就在用户目录不受影响；
  # 代价是缓存残留（GB 级缩略图）——如需彻底清除可引导用户在「设置」中清理或手动删除
  # %APPDATA%/qihe-filemanager。若未来改为清理，需同时删 thumbs/ 与 account.json（含 token）。
  deleteAppDataOnUninstall: false
