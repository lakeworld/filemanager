# CI 工作流（质量门禁）
# - 全分支门禁：push 到任意分支都会触发，PR 合并到 master 也会触发
# - bench（性能基准）不进 CI：运行 npm run bench 会改写 docs/PERF.md 数据，避免污染基准文档
# - 本工作流只做质量门禁（类型检查 / 单元测试 / e2e / 打包验证），不自动发布 Release
name: CI

# push 全分支 + pull_request 到 master
on:
  push:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 覆盖 .npmrc 的国内镜像，保证 GitHub runner 安装依赖稳定
env:
  npm_config_registry: https://registry.npmjs.org
  npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
  npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  test:
    name: Typecheck & Unit Test & Build
    runs-on: ubuntu-latest
    steps:
      # v2.5.9（A1b 同类病灶；2026-09-21 由 push 后的 CI #101 取证）：**必须 fetch-depth: 0**。
      # 本 job 的 `npm test` 里有一条自举证判据 `tests/unit/leakCheck.test.ts:64`：
      # 拿**真仓**跑 `check-no-secrets --history`，要求全历史零命中。而 checkout 默认 depth=1
      # 看不见历史 ⇒ 门禁按 A2 口径**拒绝执行**（浅克隆＝不可审，不许"审不到就当过了"）。
      # 所以那条红不是测试写坏了，是它在如实报告"这台机器上根本没盘过历史"。
      # e2e job 早在 A2 已加同一行，本 job 当时漏了 —— 漏的这一步正是本 sprint 要防的形状。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 公开仓隐私/凭据门禁（2026-09-12 泄漏事故固化）：零依赖，放最前尽早失败
      - name: Leak gate (private identity / credentials / local paths)
        run: node scripts/check-no-secrets.mjs --all

      # v2.5.9/A3：版本一致性门禁（package.json / CHANGELOG / README badge / RELEASE 说明四处同源）。
      # 零依赖、放在依赖安装之前——bump 漏一处是"发出去就收不回"的错，越早红越好。
      - name: Version consistency gate (check:version-sync)
        run: node scripts/check-version-sync.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck renderer
        run: npx tsc --noEmit

      - name: Typecheck main / preload / tests
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Unit tests
        run: npm test

      - name: Build (electron-vite)
        run: npm run build

      # v2.5.9/A2-1：渲染层 class token 对编译 CSS 全命中（AGENTS.md §二 明列出口门禁，此前本地有、CI 从不跑）。
      # 必须紧跟 build——脚本读 out/renderer 的编译产物，无产物时等于没判。
      - name: Class inventory check (check:classes)
        run: npm run check:classes

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      # v2.5.9/A2 补：**必须 fetch-depth: 0**。checkout 默认 depth=1 ⇒ runner 上是浅克隆，
      # 本 job 的历史泄漏门禁会扫到 1 个提交却照样打印"通过"（2026-09-21 用 file:// 浅克隆实测：
      # 完整仓 rev-list --objects = 5026 条 ⇄ 浅克隆 517 条、提交数 1）。脚本侧已改成
      # **浅克隆直接 rc=2 拒绝执行**（审不了就说审不了，不替公开面背书），这里补齐另一半。
      # ⚠ 边界仍要记：即便 depth 0，CI 上 `--all` 也只有**被检出的这根分支**——其它分支/标签与
      # 账号外围（AGENTS §一.9 第④⑤层）不在本门禁能力范围内，须本地/人工盘。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # v2.5.9/A2-4：历史/元数据口径泄漏门禁（tip 口径在 test job；已推送历史的残留此前靠人推前手跑）
      - name: Leak gate, history mode (check:leaks:history)
        run: npm run check:leaks:history

      - name: Build (electron-vite)
        run: npm run build

      # v2.5（r2-执行P1-7）：仅新增 hello 插件构建步骤，其余保持 master——
      # 本地经 pretest:e2e 钩子自动构建，CI 直跑 npx playwright test 需显式构建
      - name: Build hello plugin (e2e fixture)
        run: node scripts/build-hello-plugin.mjs

      - name: Install system libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 ffmpeg

      # v2.5.2：--reporter=github——失败用例名/摘要进 check annotations（API 可读），
      # 无 xvfb 的本地环境也能从 annotations 定位 CI 独有失败（list 保留完整输出）
      - name: Run Playwright tests (xvfb)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx playwright test --reporter=list,github

      # v2.5.9/A1b 补：**最能定位崩溃的 trace 之前根本没上传**。上一轮我只把 HTML 报告挪进 if: failure()，
      # 而 CI annotations 实证默认套件里的真崩溃是进程级的（search.spec.ts:101、preview-lifecycle.spec.ts:278
      # 都是 "Target page, context or browser has been closed"）——这类红全靠 playwright.config.ts 的
      # `trace: retain-on-failure` 留下的 trace.zip 才看得懂。不传 trace = 装了报警器没接电话线。
      # 只传 trace + error-context：**不传 video**（retain-on-failure 的视频每条几十 MB，崩溃轮次能攒到几百 MB，
      # 换不来额外信息量）。
      - name: Upload crash traces (failed runs only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
          if-no-files-found: ignore

      # v2.5.9/A1b：崩溃取证管道「从不执行」的根治——此前被 playwright.config.ts 的
      # testIgnore 挡住，CI 默认套件根本不跑它，线程B 阶段2/3「等 CI 抓到真实崩溃」永远等不到。
      # 实测（2026-09-21 宿主）：默认 5 轮全跑只 **3 秒**（配置里 30 分钟是取证预算上限、不是实际成本）。
      # continue-on-error：本 spec 是「看得见」的管道——真抓到崩溃 = 有收获（reason/内存曲线进 artifact），
      # 不该因此把构建判红；但它必须**真的执行**，所以不设 if 条件。
      - name: Run crash-diag spec (v2.5.7 线程B 取证管道)
        continue-on-error: true
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx playwright test --config=playwright.crash-diag.config.ts --reporter=list,github 2>&1 | tee crash-diag-run.log

      # v2.5.9/A1b 自纠（评审 Standards 轴指出）：上面那格 `continue-on-error: true` 是**故意的**
      # （真抓到崩溃 = 拿到证据，不该因此判红构建），但它同时把「这个 spec 根本没被发现」也吞了——
      # 而"被 testIgnore 挡住、CI 从不执行却全程绿"正是 A1b 当初修的原始病灶（病灶以另一种形态复发）。
      # ⇒ 补一道可执行的守卫：管道必须**真的跑出用例汇总行**。
      # 取舍写明：卡死/超时也会判红（宁可红得吵，不要再静默死一次；实测默认 5 轮仅 ~3 秒）。
      - name: Assert crash-diag pipeline really ran
        run: |
          set -e
          if [ ! -s crash-diag-run.log ]; then
            echo "::error::crash-diag 没有任何输出（管道没跑起来）"
            exit 1
          fi
          if grep -q "No tests found" crash-diag-run.log; then
            echo "::error::crash-diag spec 未被发现——testIgnore/config 又把它挡住了（A1b 病灶复发）"
            exit 1
          fi
          if ! grep -qE "[0-9]+ (passed|failed|skipped|did not run)" crash-diag-run.log; then
            echo "::error::crash-diag 没有用例汇总行，视为没跑完"
            exit 1
          fi
          echo "crash-diag 取证管道确已执行（见 crash-diag-run.log）"

      - name: Upload crash-diag results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crash-diag-results
          path: |
            crash-diag-results/
            crash-diag-run.log
          if-no-files-found: ignore

      # v2.5（PLAN-v2.5-测试 Task 4）：一致性套件自检（hello 自检 = 套件健康证明）——
      # hello 构建产物已由上一步「Build hello plugin (e2e fixture)」就位；套件内部自建正负夹具
      # v2.5.9/A1c：加 if: always()——此前 e2e 一红就连坐跳过 conformance（本步与报告同病）
      - name: Run conformance suite (hello self-check)
        if: always()
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run conformance -- out/plugins/com.qihe.hello.qbox

      # v2.5.9/A1c：主跑用 --reporter=list,github 整体覆盖 config 的 reporter，不产 HTML ⇒
      # 下面的上传步骤常年空传（实测 annotation "No files were found: playwright-report/"）。
      # 失败轮补一次「只重跑上次失败用例」并产 html——不是全量重来，成本≈红的那几条。
      - name: Produce HTML report (failed runs only)
        if: failure()
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx playwright test --last-failed --reporter=html

      # 报告只在失败轮产出（上一步 if: failure()），上传也就跟着收敛到 failure()：
      # 此前 `always() + warn` 让**每一轮绿构建都留一条"没找到文件"的告警 annotation**
      # （CI annotations 实证：`No files were found with the provided path: playwright-report/`），
      # 噪音会把真正要看的崩溃签名淹掉——告警要么有意义要么没有。ignore 兜住 conformance
      # 单独失败（e2e 全绿 ⇒ 没有报告可传）那种组合。
      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      # v2.5.9/A1e：action 大版本已升到位（本文件内 9 处 `@v4` → `@v7`，三件一次做完）。
      # ⚠ 目标版本**不是照 PLAN 里那句"升 v5"手抄的**：PLAN 写于旧读数上，2026-09-21 用
      # `curl api.github.com/repos/actions/<件>/releases/latest` 实查 = checkout **v7.0.1** /
      # setup-node **v7.0.0** / upload-artifact **v7.0.1** ⇒ 跟最新**大版本标签**（`@v7`，
      # 这两家的既有惯例是 major tag 随补丁滚动）。照抄 PLAN 会升出一个"比目标旧两代"的版本，
      # 等于把这次收口做成一次假收口——这正是本版主题"发布链不再靠手抄"要防的形态。
      # 出口判据仍是"真 run 日志里 Node20 deprecation 警告消失"，只能在 push 后验；
      # 故本笔**单独成 commit**（与功能改动分开），红了好归因、好回退。

  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # v2.5.2：公开 CI 无真实服务地址——生成占位 server.json 使 extraResources 打包不失败；
      # 发布包的真实地址由发布者本地 build/server.json 注入（gitignore，不进公开仓）
      - name: Placeholder server config (public CI)
        run: echo '{}' > build/server.json

      - name: Build & package Linux (AppImage + deb)
        if: runner.os == 'Linux'
        shell: bash
        run: npm run build:linux

      - name: Build & package Windows (NSIS)
        if: runner.os == 'Windows'
        shell: bash
        run: npm run build:win

      # v2.5.9/A2-2 边界登记：W1a（check:win-artifact）**不在任何 CI job 跑**——CI 出的 win 包
      # 必假红（缺 sharp-win32-x64，出包必须走宿主；INDEX D20 段改正②）。承担方 = 本机出口轮。
      # v2.5.9/A2-3 同源登记：内存门禁（test:memory-soak/baseline）同样不进共享 runner——绝对值
      # 阈值在 CI 必抖（待拍板 #13 已裁「同会话 A/B」口径），由本机出口轮承担。

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qihe-box-${{ runner.os }}
          path: release/
